<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Entre dans la confidence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap');

:root {
  --cream: #F5EDE0;
  --dark: #3C2A1A;
  --dark-2: #2E2013;
  --accent: #C8A882;
  --text-on-photo: #F5EDE0;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
}
body {
  font-family: 'Montserrat', Arial, sans-serif;
  background-color: var(--dark);
}

.hero {
  position: relative;
  min-height: 100vh;
  width: 100%;
  background-image: url('https://d3k81ch9hvuctc.cloudfront.net/company/SczpWt/images/4deb8241-b38d-4457-ab89-0a5045f6849f.jpeg');
  background-size: cover;
  background-position: center 68%;
  display: flex;
  align-items: flex-end;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(46,32,19,0.25) 0%,
    rgba(46,32,19,0.6) 30%,
    rgba(46,32,19,0.95) 100%);
}

.content {
  position: relative;
  z-index: 2;
  width: 100%;
  width: min(760px, calc(100% - 160px));
  max-width: none;
  padding: 24px 20px;
  margin: 0 0 5vh 80px;
  background-color: rgba(35,22,15,0.58);
  border-radius: 4px;
}

.title {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-weight: 600;
  font-size: 36px;
  line-height: 1.15;
  color: var(--text-on-photo);
  margin: 0 0 8px 0;
}

.body-copy {
  font-size: 14px;
  font-weight: 300;
  line-height: 1.5;
  color: var(--text-on-photo);
  opacity: 0.9;
  margin: 0;
}

.sub-line {
  font-family: 'Montserrat', Arial, sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.01em;
  color: var(--text-on-photo);
  margin: 10px 0 0 0;
}

.form-intro {
  font-size: 14px;
  font-weight: 300;
  line-height: 1.5;
  color: var(--text-on-photo);
  opacity: 0.9;
  margin: 2px 0 8px 0;
}

form { margin: 0; }

/* Filet de sécurité : quelle que soit la largeur réelle que Klaviyo applique en interne
   à son formulaire, ce bloc l'empêche de déborder visuellement du bloc texte. */
.klaviyo-wrap {
  width: 100%;
  overflow: hidden;
}
.klaviyo-form-VBWdyf,
.klaviyo-form-VBWdyf * {
  max-width: 100% !important;
  box-sizing: border-box !important;
}
.klaviyo-form-VBWdyf {
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
}

/* Empêche le navigateur d'imposer un fond bleu clair sur les champs
   pré-remplis automatiquement (autofill), pour garder le style sombre voulu. */
.klaviyo-textinput:-webkit-autofill,
.klaviyo-emailinput:-webkit-autofill,
.klaviyo-textinput:-webkit-autofill:hover,
.klaviyo-emailinput:-webkit-autofill:hover,
.klaviyo-textinput:-webkit-autofill:focus,
.klaviyo-emailinput:-webkit-autofill:focus {
  -webkit-text-fill-color: #F5EDE0 !important;
  -webkit-box-shadow: 0 0 0px 1000px rgba(122,79,43,0.35) inset !important;
  transition: background-color 9999s ease-in-out 0s;
}

@media (max-width: 900px) {
  .content {
    width: min(680px, calc(100% - 80px));
    margin-left: 40px;
  }
}

@media (max-width: 600px) {
  .hero { background-position: center 82%; }
  .content {
    width: calc(100% - 32px);
    max-width: none;
    padding: 20px 18px;
    margin: 0 auto 4vh auto;
  }
  .title { font-size: 26px; }
}
</style>
</head>
<body>

<!-- Script Klaviyo : va chercher le contenu du formulaire et le place dans la div plus bas -->
<script type="text/javascript" async
  src="https://static.klaviyo.com/onsite/js/klaviyo.js?company_id=SczpWt">
</script>

<div class="hero">
  <div class="content">

    <p class="title">Certaines sont déjà dans la confidence.</p>

    <p class="body-copy">Expériences, invitations, avant-premières&hellip;<br/>Des moments que l'on ne partage pas seulement derrière un écran.</p>

    <p class="sub-line">  Entre dans la confidence.<br>
  Accède aux avantages réservés aux initiées.

    <div class="klaviyo-wrap">
      <div class="klaviyo-form-VBWdyf"></div>
    </div>

    <p class="form-intro" style="margin-top:10px;">Désinscription à tout moment.</p>

  </div>
</div>

</body>
</html>
