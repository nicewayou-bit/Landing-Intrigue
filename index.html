<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Entre dans la confidence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap');

:root {
  --cream: #F5EDE0;
  --dark: #3C2A1A;
  --dark-2: #2E2013;
  --accent: #C8A882;
  --text-on-photo: #F5EDE0;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Montserrat', Arial, sans-serif;
  background-color: var(--dark);
}

.hero {
  position: relative;
  min-height: 100vh;
  width: 100%;
  background-image: url('https://d3k81ch9hvuctc.cloudfront.net/company/SczpWt/images/4deb8241-b38d-4457-ab89-0a5045f6849f.jpeg');
  background-size: cover;
  background-position: center 68%;
  display: flex;
  align-items: flex-end;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(46,32,19,0.05) 0%,
    rgba(46,32,19,0.4) 40%,
    rgba(46,32,19,0.92) 100%);
}

.content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 55%;
  padding: 40px 56px 40px 56px;
}

.title {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-weight: 600;
  font-size: 36px;
  line-height: 1.2;
  color: var(--text-on-photo);
  margin: 0 0 12px 0;
}

.body-copy {
  font-size: 14px;
  font-weight: 300;
  line-height: 1.55;
  color: var(--text-on-photo);
  opacity: 0.92;
  margin: 0 0 4px 0;
}

.sub-line {
  font-family: 'Montserrat', Arial, sans-serif;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.01em;
  color: var(--text-on-photo);
  margin: 14px 0 4px 0;
}

.form-intro {
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--text-on-photo);
  opacity: 0.9;
  margin: 0 0 10px 0;
}

form { margin: 0; }

/* Resserre l'espace entre le texte et le formulaire Klaviyo (qui a ses propres marges
   internes par défaut) pour que les deux blocs se lisent comme un ensemble compact. */
.klaviyo-form-VBWdyf {
  margin-top: -6px !important;
}

@media (max-width: 900px) {
  .content { max-width: 70%; }
}

@media (max-width: 600px) {
  .content { padding: 24px 20px 24px 20px; max-width: 100%; }
  .title { font-size: 26px; }
}
</style>
</head>
<body>

<!-- Script Klaviyo : va chercher le contenu du formulaire et le place dans la div plus bas -->
<script type="text/javascript" async
  src="https://static.klaviyo.com/onsite/js/klaviyo.js?company_id=SczpWt">
</script>

<div class="hero">
  <div class="content">

    <p class="title">Certaines sont déjà dans la confidence.</p>

    <p class="body-copy">Expériences, invitations, avant-premières&hellip;</p>
    <p class="body-copy">Des moments que l'on ne partage pas seulement derrière un écran.</p>

    <p class="sub-line">Sois parmi les prochaines à vivre la suite.</p>

    <p class="form-intro">Entre dans la confidence et accède aux avantages réservés aux initiées.</p>

    <div class="klaviyo-form-VBWdyf"></div>

  </div>
</div>

</body>
</html>
